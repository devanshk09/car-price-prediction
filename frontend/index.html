<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Car Price Prediction</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>Used Car Price Prediction</h1>
      <p class="subtitle">Enter vehicle details to estimate its selling price.</p>

      <form id="prediction-form">
        <div class="grid">
          <label>Brand<select id="brand" required><option>Hyundai</option></select></label>
          <label>Model<select id="model" required><option>Grand</option></select></label>
          <label>Vehicle age (years)<input id="vehicle_age" type="number" min="0" max="50" value="5" required></label>
          <label>Kilometers driven<input id="km_driven" type="number" min="0" value="35000" required></label>
          <label>Mileage (km/l)<input id="mileage" type="number" min="0.1" step="any" value="18.9" required></label>
          <label>Engine capacity (cc)<input id="engine" type="number" min="1" value="1197" required></label>
          <label>Maximum power (bhp)<input id="max_power" type="number" min="0.1" step="any" value="82" required></label>
          <label>Seats<input id="seats" type="number" min="1" max="20" value="5" required></label>
          <label>Seller type<select id="seller_type"><option>Individual</option><option>Dealer</option><option>Trustmark Dealer</option></select></label>
          <label>Fuel type<select id="fuel_type"><option>Petrol</option><option>Diesel</option><option>CNG</option><option>LPG</option><option>Electric</option></select></label>
          <label>Transmission<select id="transmission_type"><option>Manual</option><option>Automatic</option></select></label>
        </div>
        <button id="predict-button" type="submit">Predict price</button>
      </form>

      <p id="status-message"></p>
      <div id="result" class="result hidden">
        <span>Estimated selling price</span>
        <strong id="predicted-price"></strong>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
